name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Normal runs take 2-3 min. A hanging test (e.g. a poll loop that never
    # ends, found in the PR #97 review) must fail the job instead of blocking
    # it for GitHub's 6 h default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        id: test
        run: pytest --junitxml=pytest-junit.xml
      # Job logs need a signed-in browser; check-run annotations are readable through the
      # REST API. When the Test step fails, name the failed tests as annotations (#145).
      # GitHub keeps at most 10 error annotations per step, so: 9 tests + 1 total line.
      - name: Annotate failed tests
        if: failure() && steps.test.outcome == 'failure'
        shell: python
        run: |
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          # Windows pipes default to cp1252; a non-ASCII test id must not crash the step.
          sys.stdout.reconfigure(encoding="utf-8")
          p = pathlib.Path("pytest-junit.xml")
          if not p.exists():
              print("::error title=pytest::no junit report (pytest did not finish)")
          else:
              bad_cases = []
              for case in ET.parse(p).getroot().iter("testcase"):
                  for tag in ("failure", "error"):
                      for bad in case.findall(tag):
                          bad_cases.append((tag, case, bad))
              for tag, case, bad in bad_cases[:9]:
                  name = f"{case.get('classname')} / {case.get('name')}"[:200]
                  title = (f"{tag} {name}".replace("%", "%25")
                           .replace(",", "%2C").replace(":", "%3A"))
                  lines = (bad.get("message") or "").splitlines()
                  msg = (lines[0] if lines else "")[:300].replace("%", "%25")
                  print(f"::error title={title}::{msg}")
              total = len(bad_cases)
              print(f"::error title=pytest::{total} failed test(s) in total, "
                    f"{min(total, 9)} named above")
              print(f"annotated {min(total, 9)} of {total} failed test(s)")
