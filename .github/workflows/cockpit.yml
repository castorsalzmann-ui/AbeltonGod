name: Cockpit

# Self-updating project cockpit on GitHub Pages (#236). Needs repo Settings -> Pages ->
# Source: "GitHub Actions". If the build fails, nothing is deployed and the last site stays.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: cockpit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The gate (venv + pytest, ~8 min) runs only on push; cron / manual runs reuse the
        # gate history of the live site and take about a minute.
        run: >
          python scripts/qa/cockpit_build.py site
          ${{ github.event_name != 'push' && '--no-gate' || '' }}
          --prev-gate-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/gate.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
