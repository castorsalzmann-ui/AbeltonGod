name: Build exe

# Builds AbeltonGod.exe (PyInstaller, onedir) on Windows, smoke-tests it and uploads the
# zipped folder (#401). Runs on manual dispatch and on PRs that touch the exe build.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: publish the zip as GitHub Release with this tag (e.g. exe-v0.1)"
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/build-exe.yml"
      - "scripts/build_exe.py"
      - "scripts/exe_smoke.py"
      - "src/launcher/**"
      - "src/gui/**"
      - "src/gui_core/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[build,gui]"
      - name: Build
        run: python scripts/build_exe.py
      - name: Size of the bundle
        shell: pwsh
        run: |
          $mb = (Get-ChildItem dist/AbeltonGod -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          "unzipped folder: {0:N0} MB" -f $mb
      - name: Size per folder and largest files
        run: python scripts/build_exe.py --report dist/AbeltonGod
      # Two exes in one folder (#445): AbeltonGod.exe windowed (GUI), AbeltonGod-cli.exe console.
      - name: PE subsystem - AbeltonGod.exe windowed (2), AbeltonGod-cli.exe console (3)
        run: python scripts/build_exe.py --subsystem dist/AbeltonGod
      - name: Smoke CLI exe - version
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod-cli.exe version
      - name: Smoke CLI exe - help and tool modules load
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod-cli.exe help unknown
      - name: Smoke CLI exe - kick WAV
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod-cli.exe kick
      - name: Smoke CLI exe - goa_arrangement
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod-cli.exe goa
      - name: Smoke CLI exe - text menu with piped stdin
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod-cli.exe menu
      - name: Smoke CLI exe - without arguments opens the text menu, not the GUI
        # file-name rule of exe_entry.py; offscreen + timeout: a wrong rule would start the GUI
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          import subprocess
          r = subprocess.run([r"dist\AbeltonGod\AbeltonGod-cli.exe"], input="",
                             capture_output=True, text=True, timeout=60)
          print(r.returncode, r.stdout[-800:], r.stderr[-800:])
          assert r.returncode == 0 and "Werkzeuge:" in r.stdout, r
          assert "Abgebrochen" in r.stdout, r.stdout
      - name: Smoke CLI exe - GUI starts offscreen, opens all windows, exits 0
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod-cli.exe gui
      - name: Smoke GUI exe - selftest offscreen and on the real windows platform (qwindows.dll)
        # A windowed exe has no stdout (PyInstaller sets it to None); the launcher writes it to
        # output.log in ABELTONGOD_LOG_DIR, so the check reads that file.
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          for platform in ("offscreen", "windows"):
              logs = pathlib.Path(tempfile.mkdtemp()) / "logs"
              env = {**os.environ, "QT_QPA_PLATFORM": platform, "ABELTONGOD_LOG_DIR": str(logs)}
              r = subprocess.run([r"dist\AbeltonGod\AbeltonGod.exe", "--gui-selftest"],
                                 capture_output=True, text=True, timeout=300, env=env)
              out = logs / "output.log"
              text = r.stdout + (out.read_text(encoding="utf-8") if out.is_file() else "")
              print(platform, r.returncode, text.strip())
              assert r.returncode == 0 and "GUI selftest ok" in text, (r.returncode, text)
              assert "3 windows opened" in text and f"platform {platform}" in text, text
      - name: Smoke GUI exe - a bundle without qwindows.dll fails the GUI smoke (fault injection)
        shell: python
        env:
          QT_QPA_PLATFORM: windows
        run: |
          import shutil, subprocess
          shutil.copytree("dist/AbeltonGod", "broken/AbeltonGod")
          (__import__("pathlib").Path("broken/AbeltonGod/_internal/PySide6/plugins/platforms")
           / "qwindows.dll").unlink()
          # Run 42213400226 (console exe): without qwindows.dll the exe does not exit but waits
          # (cause not established, likely Qt's fatal-error dialog); the smoke fails it by
          # timeout. Both exes are checked here.
          for exe in (r"broken\AbeltonGod\AbeltonGod.exe", r"broken\AbeltonGod\AbeltonGod-cli.exe"):
              try:
                  r = subprocess.run([exe, "--gui-selftest"], capture_output=True, text=True,
                                     timeout=60)
              except subprocess.TimeoutExpired:
                  print(exe, "no exit within 60 s: the smoke fails by timeout (expected)")
              else:
                  print(exe, r.returncode, r.stdout, r.stderr[-1500:])
                  assert r.returncode != 0 and "GUI selftest ok" not in r.stdout, "cannot fail"
          shutil.rmtree("broken", ignore_errors=True)
      - name: Smoke GUI exe - a failed start is logged and exits 4 (#436)
        # offscreen: no screen, so neither message box is shown (they would wait for a click)
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          for stage in ("import", "qt", "window"):
              logs = pathlib.Path(tempfile.mkdtemp()) / "logs"
              env = {**os.environ, "QT_QPA_PLATFORM": "offscreen",
                     "ABELTONGOD_LOG_DIR": str(logs), "ABELTONGOD_TEST_START_FAILURE": stage}
              r = subprocess.run([r"dist\AbeltonGod\AbeltonGod.exe"], capture_output=True,
                                 text=True, timeout=120, env=env)
              log = (logs / "startup-errors.log").read_text(encoding="utf-8")
              out = logs / "output.log"
              text = r.stderr + (out.read_text(encoding="utf-8") if out.is_file() else "")
              print(stage, r.returncode, log.splitlines()[0])
              assert r.returncode == 4, (r.returncode, r.stdout, r.stderr)
              assert f"stage: {stage}" in log and "Traceback" in log, log
              assert "Details stehen in" in text, text
      - name: Smoke CLI exe - same output as python -m (SHA-256)
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod-cli.exe determinism
      - name: Smoke CLI exe - laser, perc and fx WAV, same SHA-256 as python -m (#494, #482)
        shell: python
        run: |
          import hashlib, pathlib, subprocess, sys, tempfile
          for cat, preset in (("laser", "blaster"), ("perc", "conga"), ("fx", "reverse-crash")):
              args = ["--preset", preset, "--seed", "7"]
              tmp = pathlib.Path(tempfile.mkdtemp())
              cmds = {"exe": [r"dist\AbeltonGod\AbeltonGod-cli.exe", cat, *args],
                      "py": [sys.executable, "-m", "audio_engine.kick", "--category", cat,
                             *args]}
              digest = {}
              for key, cmd in cmds.items():
                  r = subprocess.run([*cmd, "--out", str(tmp / key)], capture_output=True,
                                     text=True, timeout=300)
                  assert r.returncode == 0, (cmd, r.returncode, r.stdout, r.stderr)
                  wavs = sorted((tmp / key).glob("*.wav"))
                  assert len(wavs) == 1, wavs
                  digest[key] = (wavs[0].name, hashlib.sha256(wavs[0].read_bytes()).hexdigest())
              print(cat, digest)
              assert digest["exe"] == digest["py"], digest
      - name: Smoke CLI exe - atmos --help and a 1-bar loop at 120 BPM, same SHA-256 as python -m (#536)
        shell: python
        run: |
          import hashlib, pathlib, subprocess, sys, tempfile, wave
          exe = r"dist\AbeltonGod\AbeltonGod-cli.exe"
          r = subprocess.run([exe, "atmos", "--help"], capture_output=True, text=True,
                             timeout=120)
          print(r.returncode, r.stdout[-1500:], r.stderr[-1500:])
          assert r.returncode == 0, (r.returncode, r.stdout, r.stderr)
          assert "atmos" in r.stdout and "--set" in r.stdout, r.stdout
          args = ["--preset", "pumping-bed", "--seed", "7", "--set", "bpm=120",
                  "--set", "bars=1"]
          tmp = pathlib.Path(tempfile.mkdtemp())
          cmds = {"exe": [exe, "atmos", *args],
                  "py": [sys.executable, "-m", "audio_engine.kick", "--category", "atmos",
                         *args]}
          digest = {}
          for key, cmd in cmds.items():
              r = subprocess.run([*cmd, "--out", str(tmp / key)], capture_output=True,
                                 text=True, timeout=300)
              assert r.returncode == 0, (cmd, r.returncode, r.stdout, r.stderr)
              wavs = sorted((tmp / key).glob("*.wav"))
              assert len(wavs) == 1, wavs
              with wave.open(str(wavs[0]), "rb") as w:  # by hand: 240 * 48000 / 120
                  assert (w.getnframes(), w.getnchannels()) == (96000, 2), key
              digest[key] = (wavs[0].name, hashlib.sha256(wavs[0].read_bytes()).hexdigest())
          print("atmos", digest)
          assert digest["exe"] == digest["py"], digest
      - name: Screenshots on the real windows platform at 100 % and 150 % (#463)
        # Built exe, real qwindows plugin, every main page + Goa/Acid/Blaster. Temp output only.
        shell: python
        run: |
          import os, subprocess
          for scale in ("1", "1.5"):
              env = {**os.environ, "QT_QPA_PLATFORM": "windows", "QT_SCALE_FACTOR": scale}
              r = subprocess.run([r"dist\AbeltonGod\AbeltonGod-cli.exe", "--gui-screens",
                                  r"gui-screens"], capture_output=True, text=True,
                                 timeout=300, env=env)
              print(scale, r.returncode, r.stdout, r.stderr[-2000:])
              assert r.returncode == 0, r.returncode
      - uses: actions/upload-artifact@v4
        with:
          name: gui-screens-windows
          path: gui-screens
          if-no-files-found: error
      - name: Check that no secret was bundled
        shell: python
        run: |
          import pathlib
          bad = [p for p in pathlib.Path("dist/AbeltonGod").rglob("*")
                 if p.is_file() and (p.name == ".env" or p.suffix == ".key")]
          assert not bad, bad
          print("no .env or .key file in the bundle")
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/AbeltonGod -DestinationPath AbeltonGod-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AbeltonGod-windows
          path: AbeltonGod-windows.zip
          if-no-files-found: error
      - name: Size of the zip
        shell: pwsh
        run: '"zip: {0:N0} MB" -f ((Get-Item AbeltonGod-windows.zip).Length / 1MB)'

  release:
    # Only on a manual run with a tag; the zip is always also available as the artifact above.
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AbeltonGod-windows
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$TAG" AbeltonGod-windows.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "AbeltonGod.exe $TAG" \
            --notes "Windows build of commit $GITHUB_SHA (CI-tested only: not yet run on a user PC). Unzip the whole folder, start AbeltonGod.exe."
