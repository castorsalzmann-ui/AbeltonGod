name: Build exe

# Builds AbeltonGod.exe (PyInstaller, onedir) on Windows, smoke-tests it and uploads the
# zipped folder (#401). Runs on manual dispatch and on PRs that touch the exe build.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: publish the zip as GitHub Release with this tag (e.g. exe-v0.1)"
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/build-exe.yml"
      - "scripts/build_exe.py"
      - "scripts/exe_smoke.py"
      - "src/launcher/**"
      - "src/gui/**"
      - "src/gui_core/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[build,gui]"
      - name: Build
        run: python scripts/build_exe.py
      - name: Size of the bundle
        shell: pwsh
        run: |
          $mb = (Get-ChildItem dist/AbeltonGod -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          "unzipped folder: {0:N0} MB" -f $mb
      - name: Size per folder and largest files
        run: python scripts/build_exe.py --report dist/AbeltonGod
      - name: Smoke - version
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod.exe version
      - name: Smoke - help and tool modules load
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod.exe help unknown
      - name: Smoke - kick WAV
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod.exe kick
      - name: Smoke - goa_arrangement
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod.exe goa
      - name: Smoke - text menu with piped stdin
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod.exe menu
      - name: Smoke - GUI starts offscreen, opens all windows, exits 0
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod.exe gui
      - name: Smoke - GUI on the real windows platform plugin (qwindows.dll), all windows
        # offscreen above uses qoffscreen.dll; this run loads the plugin a double-click uses
        shell: python
        env:
          QT_QPA_PLATFORM: windows
        run: |
          import subprocess
          r = subprocess.run([r"dist\AbeltonGod\AbeltonGod.exe", "--gui-selftest"],
                             capture_output=True, text=True, timeout=300)
          print(r.returncode, r.stdout, r.stderr[-2000:])
          assert r.returncode == 0 and "GUI selftest ok" in r.stdout, r.returncode
          assert "3 windows opened" in r.stdout and "platform windows" in r.stdout, r.stdout
      - name: Smoke - a bundle without qwindows.dll fails the GUI smoke (fault injection)
        shell: python
        env:
          QT_QPA_PLATFORM: windows
        run: |
          import shutil, subprocess
          shutil.copytree("dist/AbeltonGod", "broken/AbeltonGod")
          (__import__("pathlib").Path("broken/AbeltonGod/_internal/PySide6/plugins/platforms")
           / "qwindows.dll").unlink()
          # Run 42213400226: without qwindows.dll the exe does not exit but waits (cause not
          # established, likely Qt's fatal-error dialog); the smoke steps fail it by timeout.
          try:
              r = subprocess.run([r"broken\AbeltonGod\AbeltonGod.exe", "--gui-selftest"],
                                 capture_output=True, text=True, timeout=60)
          except subprocess.TimeoutExpired:
              print("no exit within 60 s: the smoke fails by timeout (expected)")
          else:
              print(r.returncode, r.stdout, r.stderr[-1500:])
              assert r.returncode != 0 and "GUI selftest ok" not in r.stdout, "cannot fail"
          shutil.rmtree("broken", ignore_errors=True)
      - name: Smoke - a failed GUI start is logged and keeps the console (#436)
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          for stage in ("import", "qt", "window"):
              logs = pathlib.Path(tempfile.mkdtemp()) / "logs"
              env = {**os.environ, "QT_QPA_PLATFORM": "offscreen",
                     "ABELTONGOD_LOG_DIR": str(logs), "ABELTONGOD_TEST_START_FAILURE": stage}
              r = subprocess.run([r"dist\AbeltonGod\AbeltonGod.exe"], input="\n",
                                 capture_output=True, text=True, timeout=120, env=env)
              log = (logs / "startup-errors.log").read_text(encoding="utf-8")
              print(stage, r.returncode, log.splitlines()[0])
              assert r.returncode == 4, (r.returncode, r.stdout, r.stderr)
              assert f"stage: {stage}" in log and "Traceback" in log, log
              assert "Details stehen in" in r.stderr and "Enter zum Beenden" in r.stdout, r
      - name: Smoke - same output as python -m (SHA-256)
        run: python scripts/exe_smoke.py dist/AbeltonGod/AbeltonGod.exe determinism
      - name: Check that no secret was bundled
        shell: python
        run: |
          import pathlib
          bad = [p for p in pathlib.Path("dist/AbeltonGod").rglob("*")
                 if p.is_file() and (p.name == ".env" or p.suffix == ".key")]
          assert not bad, bad
          print("no .env or .key file in the bundle")
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/AbeltonGod -DestinationPath AbeltonGod-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AbeltonGod-windows
          path: AbeltonGod-windows.zip
          if-no-files-found: error
      - name: Size of the zip
        shell: pwsh
        run: '"zip: {0:N0} MB" -f ((Get-Item AbeltonGod-windows.zip).Length / 1MB)'

  release:
    # Only on a manual run with a tag; the zip is always also available as the artifact above.
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AbeltonGod-windows
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$TAG" AbeltonGod-windows.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "AbeltonGod.exe $TAG" \
            --notes "Windows build of commit $GITHUB_SHA (CI-tested only: not yet run on a user PC). Unzip the whole folder, start AbeltonGod.exe."
