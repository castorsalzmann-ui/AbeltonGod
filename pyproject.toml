[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abeltongod"
version = "0.0.1"
description = "AI music production copilot for Ableton Live 12 (Techno/Trance)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",       # sample buffers and vector maths for the audio engine
  "jsonschema>=4.20",  # runtime validation against contracts/ (was dev-only)
  "python-osc>=1.9",   # OSC message encoding/decoding for the AbletonOSC bridge (#4)
  # Claude copilot (D-014, #106). Exact pin: the research notes and the fake CLI in
  # tests/orchestrator follow this version's source and control protocol; bump deliberately.
  "claude-agent-sdk==0.2.174",
  # Same reason: the SDK's in-process MCP server (and so every fake-CLI test) runs on mcp,
  # which the SDK only bounds to <3. Pinned to the version the tests ran on.
  "mcp==2.3.0",
]

[project.optional-dependencies]
# Desktop GUI (D-029, #403). Optional: the engines, bridge and copilot run without it. Essentials
# holds QtCore/QtGui/QtWidgets (all the shell needs, wheel ~84 MB); QtMultimedia is in
# PySide6-Addons and is not used (the preview plays through winsound on Windows).
gui = [
  "PySide6-Essentials>=6.7",
]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.5",  # runs the CPU-bound audio tests on all cores (-n auto)
  "ruff>=0.6",
  "setuptools>=68",  # the #314 packaging regression test imports setuptools (Python 3.12 venvs ship without it)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"audio_engine.presets" = ["*.json", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto: pytest-xdist on all cores (`pytest -n 0` runs serially).
# --basetemp: fixed temp folder in the repo, wiped at the start of each run. Avoids the
# shared %TEMP%\\pytest-of-<user> cleanup that crashed on Windows at session end (#21).
addopts = "-ra -n auto --dist worksteal --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
